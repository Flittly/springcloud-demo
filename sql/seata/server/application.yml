# ============================================================================
# Seata Server 2.1.0 配置
# 挂载到容器 /seata-server/resources/application.yml
#
# ⚠️ 这个文件是「整体替换」镜像里自带的 application.yml 的，
#    所以镜像默认的 console / security 等配置必须原样保留，
#    否则会报 Could not resolve placeholder 'seata.security.secretKey'。
#
# MySQL 和 Nacos 都在宿主机上，容器内通过 host.docker.internal 访问。
# ============================================================================

server:
  # 控制台端口：http://127.0.0.1:7091，默认账号密码 seata / seata
  port: 7091

spring:
  application:
    name: seata-server

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}
  extend:
    logstash-appender:
      destination: 127.0.0.1:4560
    kafka-appender:
      bootstrap-servers: 127.0.0.1:9092
      topic: logback_to_logstash

console:
  user:
    username: seata
    password: seata

seata:
  # ---------- 配置中心：用本文件即可 ----------
  config:
    type: file

  # ---------- 注册中心：注册到 Nacos，客户端才能找到它 ----------
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: host.docker.internal:8848
      group: DEFAULT_GROUP
      namespace: ""
      cluster: default

  # ---------- 存储模式 ----------
  # file : 事务会话存本地文件（默认，开箱即用，不需要数据库和 JDBC 驱动）
  # db   : 存 MySQL 的 seata 库，可以 select global_table / lock_table 直接观察事务
  #
  # 官方镜像出于授权原因没内置 MySQL 驱动，而且镜像里是 JDK8。要切 db 模式：
  #   1) 先执行 04-seata-server-db.sql 建好 seata 库
  #   2) 把下面 db: 那段注释打开，mode 改成 db
  #   3) 把 mysql-connector-j-8.x.x.jar 挂进容器，例如 docker-compose.yml 里加一行：
  #      - ${USERPROFILE}/.m2/repository/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar:/seata-server/lib/jdbc/mysql-connector-j-8.4.0.jar
  store:
    mode: file
    #  db:
    #    datasource: druid
    #    db-type: mysql
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    #    url: jdbc:mysql://host.docker.internal:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    #    user: root
    #    password: 123456
    #    min-conn: 5
    #    max-conn: 100
    #    global-table: global_table
    #    branch-table: branch_table
    #    lock-table: lock_table
    #    distributed-lock-table: distributed_lock
    #    query-limit: 100
    #    max-wait: 5000

  # 不配的话默认是 ${server.port} + 1000 = 8091，也就是客户端通信端口
  server:
    service-port: 8091

  security:
    secretKey: SeataSecretKey0c382ef121d778043159209298fd40bf3850a017
    tokenValidityInMilliseconds: 1800000
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.jpeg,/**/*.ico,/api/v1/auth/login,/version.json,/health,/error
