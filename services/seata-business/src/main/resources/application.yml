server:
  port: 9101

spring:
  application:
    name: seata-business
  # business 只做服务编排，自己不连库。Seata 的 starter 会带上 spring-boot-starter-jdbc，
  # 这里把数据源自动装配排掉，免得启动时报 "Failed to configure a DataSource"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        # 本服务只用 Nacos 做服务发现，不用它的配置中心。
        # 但父 POM（services）里带了 nacos-config，不关掉这个检查启动会报
        # "No spring.config.import property has been defined"
        import-check:
          enabled: false

# ============================ Seata 客户端配置 ============================
seata:
  enabled: true
  application-id: seata-business
  # business 自己不连库（没有 DataSource），不需要 Seata 代理数据源，关掉更清爽
  enable-auto-data-source-proxy: false
  # 事务分组名：要能在下面 vgroup-mapping 里找到，否则会报
  # "can not get cluster name in registry config 'default_tx_group'"
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      # 事务分组 -> Seata Server 集群名
      default_tx_group: default
    # registry.type=file 时，客户端直接按这里的地址连 TC（Seata Server）
    grouplist:
      default: 127.0.0.1:8091
  registry:
    # 用 file 而不是 nacos：Seata Server 跑在 Docker 里时，它注册到 Nacos 的是容器内网 IP
    # （172.x.x.x），宿主机上的 Java 服务连不上，所以这里直连映射出来的 8091 端口。
    # 如果 Seata Server 的注册地址从你的机器上可达，可以改回 nacos：
    #   registry:
    #     type: nacos
    #     nacos:
    #       application: seata-server
    #       server-addr: 127.0.0.1:8848
    #       group: DEFAULT_GROUP
    #       cluster: default
    type: file

logging:
  level:
    com.flittly: info
    io.seata: info
